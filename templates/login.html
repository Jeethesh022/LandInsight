<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | LandInsight</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 52px;
            height: 52px;

            margin: auto auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 25px;
            font-weight: 800;
        }

        .brand h1 {
            font-size: 25px;
        }

        .brand p {
            margin-top: 5px;
            color: #64748b;
            font-size: 14px;
        }

        .card {
            background: white;

            padding: 32px;

            border-radius: 18px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 20px 50px
                rgba(
                    15,
                    23,
                    42,
                    0.08
                );
        }

        .card h2 {
            margin-bottom: 7px;
            font-size: 23px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;

            color: #15803d;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;

            color: #b91c1c;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #334155;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }

        .home:hover {
            color: #2563eb;
        }

    </style>

</head>


<body>

<div class="container">


    <div class="brand">

        <div class="logo">
            L
        </div>

        <h1>
            LandInsight
        </h1>

        <p>
            AI-powered land valuation
        </p>

    </div>


    <div class="card">

        <h2>
            Welcome back
        </h2>

        <p class="subtitle">
            Login to access your land valuation dashboard.
        </p>


        {% if registered == "1" %}

            <div class="success">
                Account created successfully.
                Please login.
            </div>

        {% endif %}


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

    </div>


    <a
        href="{{ url_for('index') }}"
        class="home"
    >
        ← Back to Home
    </a>


</div>

</body>

</html>
